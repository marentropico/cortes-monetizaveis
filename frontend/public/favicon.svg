<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="55%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="55%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <!-- Crisp diagonal lightning fracture; kink width (26px) < translate(42, 32) so halves never overlap -->
    <clipPath id="clipLeft">
      <polygon points="0,0 400,0 246,174 274,174 182,296 210,296 108,448 0,448" />
    </clipPath>
    <clipPath id="clipRight">
      <polygon points="512,512 108,512 108,448 210,296 182,296 274,174 246,174 400,0 512,0" />
    </clipPath>
  </defs>

  <!-- Upper-Left Half (Purple) -->
  <g clip-path="url(#clipLeft)">
    <rect x="44" y="44" width="368" height="368" rx="84" fill="url(#purpleGrad)" />
    <path
      d="M 168 144 C 168 132 181 125 191 131 L 318 209 C 328 215 328 231 318 237 L 191 315 C 181 321 168 314 168 302 Z"
      fill="#FFFFFF"
    />
  </g>

  <!-- Lower-Right Half (Orange, cleanly separated & tilted with its Play piece) -->
  <g transform="translate(42, 32) rotate(3.5 228 228)">
    <g clip-path="url(#clipRight)">
      <rect x="44" y="44" width="368" height="368" rx="84" fill="url(#orangeGrad)" />
      <path
        d="M 168 144 C 168 132 181 125 191 131 L 318 209 C 328 215 328 231 318 237 L 191 315 C 181 321 168 314 168 302 Z"
        fill="#FFFFFF"
      />
    </g>
  </g>
</svg>
